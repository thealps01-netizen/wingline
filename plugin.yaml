name: wingline
label: Wingline
version: 0.1.0
description: >-
  Wingline — a human-side view of Hermes Kanban boards: what needs you, what is running, what is
  queued and done, and what each task cost. Two views of the same data (Board and Factory) and a
  small set of actions that go through Hermes' own Kanban API. Reads Hermes data read-only.
author: Muhammed Enes Alpler
license: MIT
requires_hermes: ">=0.22.2"
kind: standalone
